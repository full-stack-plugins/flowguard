name: Guard agent installation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: flowguard
      - uses: actions/checkout@v4
        with:
          repository: full-stack-plugins/guardengine
          path: guardengine
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          repository: full-stack-plugins/flowguard-plugin
          path: flowguard-plugin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual CLI
        working-directory: flowguard
        run: cargo build --locked 
      - name: Verify signed execution evidence and external obligations
        working-directory: flowguard
        run: cargo test --locked
      - name: Exercise installation and MCP in isolated fixtures
        working-directory: flowguard
        run: python -B ../guardengine/scripts/verify_guard_installation.py --bin-dir target/debug --tools flowguard
      - name: Verify native stage CLI and MCP without approval escalation
        working-directory: flowguard
        run: python -B tests/stage_check.py
      - name: Verify portable package and stdio discovery
        working-directory: flowguard
        run: python -B ../guardengine/scripts/verify_guard_packages.py --repositories-root .. --bin-dir target/debug --tools flowguard

