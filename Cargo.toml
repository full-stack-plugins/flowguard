[package]
name = "flowguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
specguard = { path = "../specguard", version = "=0.1.0" }
guardengine = { path = "../guardengine", version = "=0.1.0" }
gitguard = { path = "../gitguard", version = "=0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.177"
tempfile = "=3.23.0"

[dev-dependencies]
tempfile = "=3.23.0"
